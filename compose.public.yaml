# Run SIEMLite on the internet with Caddy as its web server. Caddy owns ports
# 80 and 443, gets a Let's Encrypt certificate for your domain and renews it;
# SIEMLite's web ports are then reachable only through Caddy. Turn it on in .env:
#
#   COMPOSE_FILE=compose.yaml:compose.public.yaml
#   SIEMLITE_DOMAIN=siem.example.com
#
# then run docker compose up -d. The domain's DNS must point at this server,
# and ports 80 and 443 must be reachable from the internet for Let's Encrypt.
# See "Run on the internet" in the README.
services:
  siemlite:
    command:
      # HTTPS stays on inside the Docker network only (the health check and
      # loggen use it); it is not published.
      - -addr=0.0.0.0:8443
      # Plain HTTP for Caddy, which does the HTTPS. Not published, and it
      # refuses anyone but Caddy.
      - -http-addr=0.0.0.0:8080
      - -trusted-proxies=caddy
      - -syslog-udp=:5514
      - -syslog-tcp=:5514
      - -syslog-tls=:6514
    # Only syslog is published. Senders outside loopback and private networks
    # are refused unless SIEMLITE_SYSLOG_ALLOW lists them.
    ports: !override
      - "${SIEMLITE_BIND:-}:${SIEMLITE_SYSLOG_PORT:-514}:5514/udp"
      - "${SIEMLITE_BIND:-}:${SIEMLITE_SYSLOG_PORT:-514}:5514/tcp"
      - "${SIEMLITE_BIND:-}:${SIEMLITE_SYSLOG_TLS_PORT:-6514}:6514"
    networks:
      - default
      - edge

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      siemlite:
        condition: service_healthy
    environment:
      SIEMLITE_DOMAIN: ${SIEMLITE_DOMAIN:?set SIEMLITE_DOMAIN in .env to the name people will use, such as siem.example.com}
    ports:
      - "${SIEMLITE_PUBLIC_BIND:-}:${SIEMLITE_PUBLIC_HTTP_PORT:-80}:80"
      - "${SIEMLITE_PUBLIC_BIND:-}:${SIEMLITE_PUBLIC_HTTPS_PORT:-443}:443"
      - "${SIEMLITE_PUBLIC_BIND:-}:${SIEMLITE_PUBLIC_HTTPS_PORT:-443}:443/udp"
    # Only on the edge network, which only SIEMLite shares: no other container
    # can ever hold an address SIEMLite trusts as Caddy's.
    networks:
      - edge
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificates and the Let's Encrypt account. Keep it, or Caddy asks
      # Let's Encrypt again on every rebuild and can hit its rate limits.
      - caddy-data:/data
      - caddy-config:/config

networks:
  # Caddy and SIEMLite only. SIEMLite believes visitor addresses from whatever
  # "caddy" resolves to, so no other container may join this network.
  edge:

volumes:
  caddy-data:
  caddy-config:
